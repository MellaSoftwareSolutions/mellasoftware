<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1226"/>
      <stop offset="50%" stop-color="#121D3D"/>
      <stop offset="100%" stop-color="#080C1B"/>
    </linearGradient>
    <linearGradient id="uiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563FF"/>
    </linearGradient>
    <linearGradient id="desCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15244C"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#desBg)"/>

  <circle cx="650" cy="100" r="160" fill="#38BDF8" opacity="0.16" filter="blur(60px)"/>
  <circle cx="150" cy="350" r="160" fill="#2563FF" opacity="0.14" filter="blur(55px)"/>

  <!-- Top bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="48" rx="10" fill="#132042" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="24" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="14">MELLA CALM DESIGN SYSTEM &amp; UI CANVAS</text>
    <rect x="580" y="10" width="144" height="28" rx="14" fill="rgba(56,189,248,0.18)" stroke="#38BDF8" stroke-width="1"/>
    <text x="596" y="28" fill="#38BDF8" font-family="sans-serif" font-weight="600" font-size="11">ACCESSIBLE 100%</text>
  </g>

  <!-- Left Main Interactive Wireframe & Design System Component Sheet -->
  <g transform="translate(30, 88)">
    <rect width="470" height="332" rx="14" fill="url(#desCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">UI COMPONENT SPECIFICATIONS</text>

    <!-- UI Buttons Row -->
    <g transform="translate(24, 52)">
      <rect width="130" height="42" rx="21" fill="url(#uiGlow)"/>
      <text x="36" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Primary Action</text>

      <rect x="146" width="130" height="42" rx="21" fill="transparent" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="180" y="26" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="12">Secondary</text>

      <rect x="292" width="120" height="42" rx="21" fill="rgba(255,255,255,0.06)"/>
      <text x="330" y="26" fill="#94A3B8" font-family="sans-serif" font-weight="600" font-size="12">Ghost</text>
    </g>

    <!-- Typography Scale Preview Card -->
    <g transform="translate(24, 114)">
      <rect width="422" height="110" rx="10" fill="#080C1B" stroke="rgba(37,99,255,0.2)" stroke-width="1"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="800">Heading 01 · Inter Display 800</text>
      <text x="20" y="58" fill="#60A5FA" font-family="sans-serif" font-size="14" font-weight="600">Subtitle 02 · System Mono 600</text>
      <text x="20" y="84" fill="#94A3B8" font-family="sans-serif" font-size="12">Calm interface principles with high contrast ratio ratios and fluid grids.</text>
    </g>

    <!-- Color Swatches Row -->
    <g transform="translate(24, 240)">
      <rect width="70" height="56" rx="8" fill="#0B1226"/>
      <rect x="6" y="6" width="58" height="26" rx="4" fill="#2563FF"/>
      <text x="12" y="46" fill="#94A3B8" font-family="sans-serif" font-size="10">#2563FF</text>

      <rect x="85" width="70" height="56" rx="8" fill="#0B1226"/>
      <rect x="91" y="6" width="58" height="26" rx="4" fill="#38BDF8"/>
      <text x="97" y="46" fill="#94A3B8" font-family="sans-serif" font-size="10">#38BDF8</text>

      <rect x="170" width="70" height="56" rx="8" fill="#0B1226"/>
      <rect x="176" y="6" width="58" height="26" rx="4" fill="#0F172A"/>
      <text x="182" y="46" fill="#94A3B8" font-family="sans-serif" font-size="10">#0F172A</text>

      <rect x="255" width="138" height="56" rx="8" fill="#0B1226" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <text x="267" y="34" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">Figma Token Sync</text>
    </g>
  </g>

  <!-- Right Side Layout & Micro-interactions Preview -->
  <g transform="translate(520, 88)">
    <rect width="250" height="332" rx="14" fill="url(#desCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">LAYOUT PROTOTYPE</text>

    <g transform="translate(20, 50)">
      <rect width="210" height="110" rx="10" fill="#080C1B" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="12" rx="3" fill="#2563FF"/>
      <rect x="16" y="36" width="160" height="14" rx="3" fill="#FFFFFF"/>
      <rect x="16" y="58" width="120" height="10" rx="3" fill="#94A3B8"/>
      <rect x="16" y="78" width="178" height="16" rx="8" fill="rgba(56,189,248,0.15)"/>

      <rect y="126" width="210" height="120" rx="10" fill="#080C1B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="36" cy="156" r="14" fill="#38BDF8"/>
      <rect x="62" y="146" width="120" height="12" rx="3" fill="#FFFFFF"/>
      <rect x="62" y="164" width="80" height="10" rx="3" fill="#64748B"/>
    </g>
  </g>
</svg>
