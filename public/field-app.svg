<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#101318"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#151A21" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Map Interface View (Left) -->
  <g transform="translate(44, 44)">
    <rect width="440" height="362" rx="10" fill="#101318" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Map Grid Lines -->
    <path d="M40 0V362 M120 0V362 M200 0V362 M280 0V362 M360 0V362" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <path d="M0 60H440 M0 140H440 M0 220H440 M0 300H440" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    
    <!-- Route Path -->
    <path d="M80 280 L180 180 L260 220 L360 100" stroke="#2563FF" stroke-width="3" stroke-dasharray="6 4"/>
    
    <!-- GPS Pins -->
    <circle cx="80" cy="280" r="10" fill="#2563FF" fill-opacity="0.3"/>
    <circle cx="80" cy="280" r="5" fill="#4D7CFF"/>

    <circle cx="180" cy="180" r="10" fill="#2563FF" fill-opacity="0.3"/>
    <circle cx="180" cy="180" r="5" fill="#4D7CFF"/>

    <circle cx="260" cy="220" r="10" fill="#2563FF" fill-opacity="0.3"/>
    <circle cx="260" cy="220" r="5" fill="#4D7CFF"/>

    <circle cx="360" cy="100" r="16" fill="#2563FF" fill-opacity="0.3"/>
    <circle cx="360" cy="100" r="8" fill="#2563FF"/>
    <circle cx="360" cy="100" r="4" fill="#FFFFFF"/>

    <!-- Map Floating Widget -->
    <rect x="20" y="20" width="160" height="36" rx="18" fill="#151A21" stroke="rgba(37,99,255,0.4)" stroke-width="1"/>
    <circle cx="38" cy="38" r="5" fill="#4D7CFF"/>
    <rect x="52" y="32" width="100" height="12" rx="3" fill="#F5F7FA"/>
  </g>

  <!-- Dispatch Status List (Right) -->
  <g transform="translate(500, 44)">
    <rect width="256" height="362" rx="10" fill="#101318" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="20" y="20" width="120" height="16" rx="4" fill="#F5F7FA"/>
    
    <!-- Team Member 1 -->
    <g transform="translate(16, 56)">
      <rect width="224" height="64" rx="8" fill="#151A21" stroke="rgba(37,99,255,0.3)" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="rgba(37,99,255,0.2)"/>
      <rect x="56" y="20" width="90" height="12" rx="3" fill="#F5F7FA"/>
      <rect x="56" y="38" width="60" height="8" rx="2" fill="#4D7CFF"/>
    </g>

    <!-- Team Member 2 -->
    <g transform="translate(16, 132)">
      <rect width="224" height="64" rx="8" fill="#151A21" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="rgba(255,255,255,0.06)"/>
      <rect x="56" y="20" width="110" height="12" rx="3" fill="#F5F7FA"/>
      <rect x="56" y="38" width="70" height="8" rx="2" fill="#8B929D" fill-opacity="0.6"/>
    </g>

    <!-- Team Member 3 -->
    <g transform="translate(16, 208)">
      <rect width="224" height="64" rx="8" fill="#151A21" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="32" cy="32" r="14" fill="rgba(255,255,255,0.06)"/>
      <rect x="56" y="20" width="80" height="12" rx="3" fill="#F5F7FA"/>
      <rect x="56" y="38" width="50" height="8" rx="2" fill="#8B929D" fill-opacity="0.6"/>
    </g>
  </g>
</svg>

