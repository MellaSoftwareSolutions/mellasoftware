<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#101318"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#151A21" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Sidebar Navigation -->
  <g transform="translate(44, 44)">
    <rect width="180" height="362" rx="10" fill="#101318" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="20" y="20" width="100" height="16" rx="4" fill="#2563FF"/>
    
    <!-- Nav Items -->
    <rect x="16" y="60" width="148" height="32" rx="6" fill="rgba(37,99,255,0.15)"/>
    <circle cx="34" cy="76" r="5" fill="#4D7CFF"/>
    <rect x="48" y="70" width="80" height="12" rx="3" fill="#F5F7FA"/>

    <rect x="16" y="104" width="148" height="32" rx="6" fill="transparent"/>
    <circle cx="34" cy="120" r="5" fill="#8B929D"/>
    <rect x="48" y="114" width="70" height="12" rx="3" fill="#8B929D" fill-opacity="0.6"/>

    <rect x="16" y="148" width="148" height="32" rx="6" fill="transparent"/>
    <circle cx="34" cy="164" r="5" fill="#8B929D"/>
    <rect x="48" y="158" width="90" height="12" rx="3" fill="#8B929D" fill-opacity="0.6"/>
  </g>

  <!-- Calendar Schedule Grid -->
  <g transform="translate(240, 44)">
    <rect width="516" height="362" rx="10" fill="#101318" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Calendar Header -->
    <rect x="20" y="20" width="140" height="18" rx="4" fill="#F5F7FA"/>
    <rect x="376" y="18" width="120" height="24" rx="12" fill="#2563FF"/>
    
    <!-- Days of Week Header -->
    <g transform="translate(20, 56)">
      <rect width="64" height="24" rx="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="74" width="64" height="24" rx="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="148" width="64" height="24" rx="4" fill="rgba(37,99,255,0.2)"/>
      <rect x="222" width="64" height="24" rx="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="296" width="64" height="24" rx="4" fill="rgba(255,255,255,0.04)"/>
      <rect x="370" width="64" height="24" rx="4" fill="rgba(255,255,255,0.04)"/>
    </g>

    <!-- Schedule Time Blocks -->
    <g transform="translate(20, 96)">
      <!-- Row 1 Booking Card -->
      <rect width="476" height="72" rx="8" fill="#151A21" stroke="rgba(37,99,255,0.3)" stroke-width="1"/>
      <rect x="16" y="16" width="120" height="14" rx="3" fill="#F5F7FA"/>
      <rect x="16" y="38" width="80" height="10" rx="2" fill="#4D7CFF"/>
      <rect x="360" y="24" width="100" height="24" rx="12" fill="rgba(37,99,255,0.2)" stroke="rgba(37,99,255,0.4)" stroke-width="1"/>
      <circle cx="376" cy="36" r="4" fill="#4D7CFF"/>

      <!-- Row 2 Booking Card -->
      <rect y="84" width="476" height="72" rx="8" fill="#151A21" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="16" y="100" width="140" height="14" rx="3" fill="#F5F7FA"/>
      <rect x="16" y="122" width="90" height="10" rx="2" fill="#8B929D" fill-opacity="0.6"/>
      <rect x="360" y="108" width="100" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>

      <!-- Row 3 Booking Card -->
      <rect y="168" width="476" height="72" rx="8" fill="#151A21" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="16" y="184" width="110" height="14" rx="3" fill="#F5F7FA"/>
      <rect x="16" y="206" width="70" height="10" rx="2" fill="#8B929D" fill-opacity="0.6"/>
      <rect x="360" y="192" width="100" height="24" rx="12" fill="rgba(37,99,255,0.2)"/>
    </g>
  </g>
