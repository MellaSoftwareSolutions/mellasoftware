<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071224"/>
      <stop offset="50%" stop-color="#0B1E3D"/>
      <stop offset="100%" stop-color="#050C1A"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#2563FF"/>
    </linearGradient>
    <linearGradient id="clinicCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10254A"/>
      <stop offset="100%" stop-color="#0A152E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#clinicBg)"/>

  <circle cx="200" cy="120" r="160" fill="#00D2FF" opacity="0.14" filter="blur(60px)"/>
  <circle cx="650" cy="360" r="170" fill="#2563FF" opacity="0.15" filter="blur(55px)"/>

  <!-- Top bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="48" rx="10" fill="#0F2144" stroke="rgba(0,210,255,0.25)" stroke-width="1"/>
    <circle cx="34" cy="24" r="8" fill="#00D2FF"/>
    <path d="M34 19 V29 M29 24 H39" stroke="#0B1E3D" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">MEDICARE EHR &amp; CLINICAL SUITE</text>
    <rect x="610" y="10" width="114" height="28" rx="14" fill="rgba(0,210,255,0.15)" stroke="#00D2FF" stroke-width="1"/>
    <text x="626" y="28" fill="#00D2FF" font-family="sans-serif" font-weight="600" font-size="11">● LIVE DISPATCH</text>
  </g>

  <!-- Left Main Patient Vitals Monitor -->
  <g transform="translate(30, 88)">
    <rect width="470" height="332" rx="14" fill="url(#clinicCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Patient Info Tag -->
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">PATIENT MONITORING · ICU BED #04</text>
    <text x="24" y="68" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Heart Rate &amp; Oxygen Vitals</text>

    <!-- ECG Electrocardiogram Line Wave -->
    <g transform="translate(24, 85)">
      <rect width="422" height="120" rx="10" fill="#071224" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
      <path d="M10 60 L60 60 L75 15 L90 100 L105 40 L120 70 L130 60 L200 60 L215 20 L230 105 L245 45 L260 70 L270 60 L350 60 L365 25 L380 95 L410 60" fill="none" stroke="url(#pulseGlow)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="365" cy="25" r="5" fill="#00D2FF"/>
    </g>

    <!-- Vitals Stats Row -->
    <g transform="translate(24, 220)">
      <rect width="130" height="84" rx="10" fill="#071224"/>
      <text x="16" y="28" fill="#94A3B8" font-family="sans-serif" font-size="11">PULSE RATE</text>
      <text x="16" y="62" fill="#00D2FF" font-family="sans-serif" font-size="26" font-weight="800">72 <tspan font-size="12" fill="#94A3B8">bpm</tspan></text>

      <rect x="146" width="130" height="84" rx="10" fill="#071224"/>
      <text x="162" y="28" fill="#94A3B8" font-family="sans-serif" font-size="11">BLOOD PRESS.</text>
      <text x="162" y="62" fill="#60A5FA" font-family="sans-serif" font-size="26" font-weight="800">120/80</text>

      <rect x="292" width="130" height="84" rx="10" fill="#071224"/>
      <text x="308" y="28" fill="#94A3B8" font-family="sans-serif" font-size="11">SpO2 LEVEL</text>
      <text x="308" y="62" fill="#38BDF8" font-family="sans-serif" font-size="26" font-weight="800">99%</text>
    </g>
  </g>

  <!-- Right Side Doctor Appointments & Prescription Dispatch -->
  <g transform="translate(520, 88)">
    <rect width="250" height="332" rx="14" fill="url(#clinicCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">CLINIC DISPATCH QUEUE</text>

    <!-- Queue Items -->
    <g transform="translate(20, 50)">
      <rect width="210" height="70" rx="8" fill="#071224" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
      <text x="16" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Dr. Sarah T. · Cardiology</text>
      <text x="16" y="46" fill="#94A3B8" font-family="sans-serif" font-size="11">Patient #1094 · Room 3B</text>
      <rect x="140" y="34" width="60" height="22" rx="4" fill="#2563FF"/>
      <text x="150" y="49" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">In Progress</text>

      <rect y="82" width="210" height="70" rx="8" fill="#071224"/>
      <text x="16" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Dr. Marcus B. · Neurology</text>
      <text x="16" y="128" fill="#94A3B8" font-family="sans-serif" font-size="11">Patient #1098 · Room 1A</text>
      <rect x="140" y="116" width="60" height="22" rx="4" fill="#1E293B"/>
      <text x="154" y="131" fill="#94A3B8" font-family="sans-serif" font-size="10">Waiting</text>

      <rect y="164" width="210" height="90" rx="8" fill="#071224" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <text x="16" y="188" fill="#00D2FF" font-family="sans-serif" font-size="11" font-weight="700">PHARMACY DISPATCH</text>
      <text x="16" y="208" fill="#FFFFFF" font-family="sans-serif" font-size="12">Prescription #8841 Automated</text>
      <text x="16" y="230" fill="#64748B" font-family="sans-serif" font-size="10">Barcode verified · Sent to Pharmacy</text>
    </g>
  </g>
</svg>
