<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Blue Gradient Base -->
  <defs>
    <linearGradient id="advBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1021"/>
      <stop offset="50%" stop-color="#111A36"/>
      <stop offset="100%" stop-color="#090D1C"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" rx="16" fill="url(#advBg)"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="700" cy="80" r="180" fill="#2563FF" opacity="0.18" filter="blur(60px)"/>
  <circle cx="100" cy="380" r="160" fill="#00D2FF" opacity="0.12" filter="blur(50px)"/>

  <!-- Top Navigation / App Header Bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="50" rx="12" fill="#131C38" stroke="rgba(37,99,255,0.25)" stroke-width="1"/>
    
    <!-- Logo Badge -->
    <rect x="16" y="13" width="24" height="24" rx="6" fill="url(#blueGlow)"/>
    <text x="50" y="30" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15">AdVouch Escrow</text>
    
    <!-- Status Pill -->
    <rect x="580" y="13" width="144" height="24" rx="12" fill="rgba(37,99,255,0.18)" stroke="#2563FF" stroke-width="1"/>
    <circle cx="594" cy="25" r="4" fill="#00D2FF"/>
    <text x="606" y="29" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="0.5">ESCROW ACTIVE</text>
  </g>

  <!-- Left Main Stat Dashboard Card -->
  <g transform="translate(30, 90)">
    <rect width="460" height="330" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Stat 1 -->
    <text x="24" y="38" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="500">TOTAL CAMPAIGN VOLUME</text>
    <text x="24" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="32" font-weight="800">$184,950<tspan font-size="16" fill="#38BDF8">.00</tspan></text>
    
    <!-- Performance Sparkline Chart -->
    <path d="M24 180 C80 160, 120 200, 180 130 C240 70, 300 150, 360 100 C400 70, 420 85, 436 75" fill="none" stroke="url(#blueGlow)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M24 180 C80 160, 120 200, 180 130 C240 70, 300 150, 360 100 C400 70, 420 85, 436 75 L436 210 L24 210 Z" fill="url(#blueGlow)" opacity="0.12"/>

    <!-- Chart Grid Lines -->
    <line x1="24" y1="120" x2="436" y2="120" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
    <line x1="24" y1="170" x2="436" y2="170" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>

    <!-- Campaign Escrow Milestones -->
    <g transform="translate(24, 230)">
      <rect width="412" height="76" rx="10" fill="#0B1226" stroke="rgba(37,99,255,0.2)" stroke-width="1"/>
      <circle cx="30" cy="38" r="16" fill="#2563FF" opacity="0.2"/>
      <path d="M24 38 L28 42 L36 34" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="13">Milestone #2 Locked in Smart Escrow</text>
      <text x="60" y="52" fill="#64748B" font-family="sans-serif" font-size="11">Verification completed · Funds released upon proof</text>
      <rect x="320" y="24" width="76" height="28" rx="6" fill="#2563FF"/>
      <text x="336" y="42" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="11">Verify</text>
    </g>
  </g>

  <!-- Right Side Verified Parties & Security Panel -->
  <g transform="translate(510, 90)">
    <!-- Buyer Card -->
    <rect width="260" height="155" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">VERIFIED ADVERTISER</text>
    <rect x="20" y="48" width="40" height="40" rx="20" fill="#1E293B"/>
    <circle cx="40" cy="68" r="12" fill="#2563FF"/>
    <text x="72" y="64" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">Global Media Co.</text>
    <text x="72" y="80" fill="#38BDF8" font-family="sans-serif" font-size="11">ID Checked · Tier 1</text>
    <rect x="20" y="104" width="220" height="32" rx="8" fill="#0B1226"/>
    <text x="32" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">Trust Rating: <tspan fill="#00D2FF" font-weight="700">99.8% (540 deals)</tspan></text>

    <!-- Publisher Card -->
    <g transform="translate(0, 175)">
      <rect width="260" height="155" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">VERIFIED PUBLISHER</text>
      <rect x="20" y="48" width="40" height="40" rx="20" fill="#1E293B"/>
      <circle cx="40" cy="68" r="12" fill="#00D2FF"/>
      <text x="72" y="64" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">TechHub Channel</text>
      <text x="72" y="80" fill="#60A5FA" font-family="sans-serif" font-size="11">Audience Verified</text>
      <rect x="20" y="104" width="220" height="32" rx="8" fill="#0B1226"/>
      <text x="32" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">Payout Status: <tspan fill="#38BDF8" font-weight="700">Automated Instant</tspan></text>
    </g>
  </g>
</svg>
