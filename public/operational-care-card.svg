<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="opBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060C1B"/>
      <stop offset="50%" stop-color="#0C1734"/>
      <stop offset="100%" stop-color="#040815"/>
    </linearGradient>
    <linearGradient id="opGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="opCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112044"/>
      <stop offset="100%" stop-color="#091126"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#opBg)"/>

  <circle cx="200" cy="380" r="160" fill="#2563FF" opacity="0.16" filter="blur(60px)"/>
  <circle cx="680" cy="100" r="160" fill="#00D2FF" opacity="0.15" filter="blur(55px)"/>

  <!-- Top bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="48" rx="10" fill="#101D3D" stroke="rgba(37,99,255,0.25)" stroke-width="1"/>
    <text x="24" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="14">LIVE PRODUCTION INCIDENT &amp; APM MONITOR</text>
    <rect x="580" y="10" width="144" height="28" rx="14" fill="rgba(0,210,255,0.18)" stroke="#00D2FF" stroke-width="1"/>
    <circle cx="594" cy="24" r="4" fill="#00D2FF"/>
    <text x="606" y="28" fill="#00D2FF" font-family="sans-serif" font-weight="600" font-size="11">OPERATIONAL 100%</text>
  </g>

  <!-- Left Main APM Performance Monitoring Dashboard -->
  <g transform="translate(30, 88)">
    <rect width="470" height="332" rx="14" fill="url(#opCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">REAL-TIME SYSTEM METRICS</text>

    <!-- Error rate & response chart -->
    <text x="24" y="68" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">Error Rate: <tspan fill="#00D2FF">0.0001%</tspan></text>

    <g transform="translate(24, 85)">
      <rect width="422" height="130" rx="10" fill="#060C1B" stroke="rgba(37,99,255,0.2)" stroke-width="1"/>
      
      <!-- Chart line -->
      <path d="M10 90 L50 85 L90 92 L130 60 L170 65 L210 30 L250 40 L290 25 L330 35 L370 20 L410 15" fill="none" stroke="url(#opGlow)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M10 90 L50 85 L90 92 L130 60 L170 65 L210 30 L250 40 L290 25 L330 35 L370 20 L410 15 L410 120 L10 120 Z" fill="url(#opGlow)" opacity="0.15"/>
      <circle cx="410" cy="15" r="5" fill="#00D2FF"/>
    </g>

    <!-- Stat Pill Row -->
    <g transform="translate(24, 230)">
      <rect width="130" height="74" rx="8" fill="#060C1B"/>
      <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">CPU USAGE</text>
      <text x="14" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">18.4%</text>

      <rect x="146" width="130" height="74" rx="8" fill="#060C1B"/>
      <text x="160" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">MEMORY</text>
      <text x="160" y="54" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="800">2.1 GB</text>

      <rect x="292" width="130" height="74" rx="8" fill="#060C1B"/>
      <text x="306" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">RECOVERY</text>
      <text x="306" y="54" fill="#00D2FF" font-family="sans-serif" font-size="22" font-weight="800">&lt; 1 sec</text>
    </g>
  </g>

  <!-- Right Side Live Log Stream & Alerts -->
  <g transform="translate(520, 88)">
    <rect width="250" height="332" rx="14" fill="url(#opCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">PRODUCTION LOG LOGSTREAM</text>

    <g transform="translate(20, 50)">
      <rect width="210" height="252" rx="10" fill="#060C1B" stroke="rgba(0,210,255,0.2)" stroke-width="1"/>
      <text x="14" y="28" fill="#00D2FF" font-family="monospace" font-size="10">[14:32:01] INFO  HealthCheck OK</text>
      <text x="14" y="50" fill="#60A5FA" font-family="monospace" font-size="10">[14:32:05] WARN  AutoScaler +2 Nodes</text>
      <text x="14" y="72" fill="#00D2FF" font-family="monospace" font-size="10">[14:32:10] INFO  Backup Sync Done</text>
      <text x="14" y="94" fill="#94A3B8" font-family="monospace" font-size="10">[14:32:15] DEBUG DB Connection Pool 42</text>
      <text x="14" y="116" fill="#00D2FF" font-family="monospace" font-size="10">[14:32:20] INFO  SSL Cert Valid 320d</text>
      <text x="14" y="138" fill="#60A5FA" font-family="monospace" font-size="10">[14:32:25] INFO  Deployment Green</text>

      <line x1="14" y1="160" x2="196" y2="160" stroke="rgba(255,255,255,0.08)"/>
      <rect x="14" y="176" width="182" height="36" rx="8" fill="#2563FF"/>
      <text x="36" y="198" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11">24/7 Managed On-Call</text>
    </g>
  </g>
</svg>
