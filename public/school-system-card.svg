<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="schoolBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091024"/>
      <stop offset="50%" stop-color="#0E1B3B"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="schCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142347"/>
      <stop offset="100%" stop-color="#0B1328"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#schoolBg)"/>

  <circle cx="680" cy="120" r="170" fill="#38BDF8" opacity="0.14" filter="blur(60px)"/>
  <circle cx="100" cy="360" r="150" fill="#2563FF" opacity="0.15" filter="blur(50px)"/>

  <!-- Top bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="48" rx="10" fill="#111D3B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="16" y="14" width="120" height="20" rx="4" fill="#38BDF8" opacity="0.9"/>
    <text x="24" y="29" fill="#0F172A" font-family="sans-serif" font-weight="800" font-size="11">ACADEMIC ERP v4.2</text>
    <text x="160" y="29" fill="#94A3B8" font-family="sans-serif" font-size="12">Spring Semester Analytics · 1,420 Active Students</text>
  </g>

  <!-- Left Side Gradebook & Performance Charts -->
  <g transform="translate(30, 88)">
    <rect width="470" height="332" rx="14" fill="url(#schCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">STUDENT PERFORMANCE ANALYTICS</text>
    <text x="24" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">Class Average: <tspan fill="#38BDF8">3.84 GPA</tspan></text>

    <!-- Bar Chart Grid -->
    <g transform="translate(24, 90)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="422" y2="0" stroke="rgba(255,255,255,0.06)"/>
      <line x1="0" y1="50" x2="422" y2="50" stroke="rgba(255,255,255,0.06)"/>
      <line x1="0" y1="100" x2="422" y2="100" stroke="rgba(255,255,255,0.06)"/>
      <line x1="0" y1="150" x2="422" y2="150" stroke="rgba(255,255,255,0.06)"/>

      <!-- Bars -->
      <rect x="20" y="20" width="34" height="130" rx="6" fill="url(#barGrad)"/>
      <text x="25" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">STEM</text>

      <rect x="85" y="45" width="34" height="105" rx="6" fill="url(#barGrad)"/>
      <text x="91" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">MATH</text>

      <rect x="150" y="10" width="34" height="140" rx="6" fill="url(#barGrad)"/>
      <text x="158" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">PHYS</text>

      <rect x="215" y="30" width="34" height="120" rx="6" fill="url(#barGrad)"/>
      <text x="221" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">ENG</text>

      <rect x="280" y="55" width="34" height="95" rx="6" fill="url(#barGrad)"/>
      <text x="287" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">HIST</text>

      <rect x="345" y="15" width="34" height="135" rx="6" fill="url(#barGrad)"/>
      <text x="350" y="170" fill="#94A3B8" font-family="sans-serif" font-size="10">CS 101</text>
    </g>
  </g>

  <!-- Right Side Quick Cards & Attendance Status -->
  <g transform="translate(520, 88)">
    <rect width="250" height="156" rx="14" fill="url(#schCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">ATTENDANCE METRICS</text>
    <text x="20" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="800">97.6%</text>
    <rect x="20" y="90" width="210" height="8" rx="4" fill="#1E293B"/>
    <rect x="20" y="90" width="202" height="8" rx="4" fill="#38BDF8"/>
    <text x="20" y="125" fill="#64748B" font-family="sans-serif" font-size="11">Automated biometric RFID log</text>

    <!-- Schedule Item -->
    <g transform="translate(0, 176)">
      <rect width="250" height="156" rx="14" fill="url(#schCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">EXAM SCHEDULE</text>
      <rect x="20" y="48" width="210" height="42" rx="8" fill="#0B1328" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <text x="32" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Midterm Calculus III</text>
      <text x="180" y="74" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">09:00 AM</text>
      
      <rect x="20" y="98" width="210" height="42" rx="8" fill="#0B1328" opacity="0.6"/>
      <text x="32" y="124" fill="#94A3B8" font-family="sans-serif" font-size="12">Advanced Physics Lab</text>
      <text x="180" y="124" fill="#64748B" font-family="sans-serif" font-size="11">02:00 PM</text>
    </g>
  </g>
</svg>
