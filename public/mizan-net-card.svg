<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mizanBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#0D1832"/>
      <stop offset="100%" stop-color="#060A17"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563FF"/>
    </linearGradient>
    <linearGradient id="mizanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132042"/>
      <stop offset="100%" stop-color="#0A1124"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#mizanBg)"/>

  <!-- Orbs -->
  <circle cx="150" cy="100" r="160" fill="#2563FF" opacity="0.15" filter="blur(60px)"/>
  <circle cx="650" cy="350" r="170" fill="#38BDF8" opacity="0.14" filter="blur(55px)"/>

  <!-- Header search bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="52" rx="12" fill="#121D38" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <circle cx="34" cy="26" r="8" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <line x1="40" y1="32" x2="47" y2="39" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="31" fill="#FFFFFF" font-family="sans-serif" font-weight="500" font-size="14">Search Ethiopian Civil Code, Proclamation No. 1234/2021, Precedents...</text>
    <rect x="635" y="12" width="90" height="28" rx="8" fill="url(#aiGlow)"/>
    <text x="652" y="30" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">AI Query</text>
  </g>

  <!-- Main AI Reasoning & Citation Column -->
  <g transform="translate(30, 92)">
    <rect width="480" height="328" rx="14" fill="url(#mizanCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- AI Response Pill -->
    <rect x="24" y="24" width="168" height="26" rx="13" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="38" cy="37" r="4" fill="#38BDF8"/>
    <text x="50" y="41" fill="#38BDF8" font-family="sans-serif" font-weight="600" font-size="11">LEGAL INTELLIGENCE 99.4%</text>

    <!-- Query Result -->
    <text x="24" y="80" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Commercial Lease Escrow &amp; Contract Analysis</text>
    <text x="24" y="106" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="400">Based on Cassation Bench Decision Vol. 22 (Proc. 1147):</text>
    
    <!-- AI Summary Box -->
    <rect x="24" y="124" width="432" height="106" rx="10" fill="#0A1124" stroke="rgba(37,99,255,0.2)" stroke-width="1"/>
    <text x="40" y="150" fill="#E2E8F0" font-family="sans-serif" font-size="12" leading="18">Article 2975 of the Ethiopian Civil Code mandates explicit written</text>
    <text x="40" y="172" fill="#E2E8F0" font-family="sans-serif" font-size="12">consent for structural modifications. Mandatory precedent requires</text>
    <text x="40" y="194" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">30-day statutory notice prior to arbitration invocation.</text>

    <!-- Citations Tags -->
    <g transform="translate(24, 246)">
      <rect width="130" height="28" rx="6" fill="#17264C"/>
      <text x="12" y="18" fill="#60A5FA" font-family="sans-serif" font-size="11">Civil Code Art. 2975</text>
      <rect x="140" width="130" height="28" rx="6" fill="#17264C"/>
      <text x="152" y="18" fill="#60A5FA" font-family="sans-serif" font-size="11">Fed. Supreme Court #84</text>
      <rect x="280" width="120" height="28" rx="6" fill="#17264C"/>
      <text x="292" y="18" fill="#60A5FA" font-family="sans-serif" font-size="11">Proc. 1147/2019</text>
    </g>
  </g>

  <!-- Right Side Knowledge Graph & Statutory Tree -->
  <g transform="translate(530, 92)">
    <rect width="240" height="328" rx="14" fill="url(#mizanCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">PRECEDENT GRAPH</text>

    <!-- Node Network Visualization -->
    <g transform="translate(20, 50)">
      <circle cx="100" cy="70" r="28" fill="url(#aiGlow)"/>
      <text x="100" y="74" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">ART. 2975</text>

      <circle cx="40" cy="160" r="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <text x="40" y="164" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Vol. 22</text>

      <circle cx="160" cy="160" r="20" fill="#1E293B" stroke="#2563FF" stroke-width="2"/>
      <text x="160" y="164" fill="#60A5FA" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">Proc 1147</text>

      <!-- Connecting Lines -->
      <line x1="82" y1="90" x2="52" y2="142" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="118" y1="90" x2="148" y2="142" stroke="#2563FF" stroke-width="2"/>
    </g>

    <rect x="20" y="240" width="200" height="66" rx="10" fill="#0A1124" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <text x="32" y="264" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Amharic &amp; English</text>
    <text x="32" y="284" fill="#64748B" font-family="sans-serif" font-size="11">Dual-language legal neural model</text>
  </g>
</svg>
