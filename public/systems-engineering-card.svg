<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sysBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E1F"/>
      <stop offset="50%" stop-color="#0E1938"/>
      <stop offset="100%" stop-color="#050917"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sysCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122146"/>
      <stop offset="100%" stop-color="#0A1227"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#sysBg)"/>

  <circle cx="200" cy="100" r="160" fill="#2563FF" opacity="0.16" filter="blur(60px)"/>
  <circle cx="650" cy="350" r="170" fill="#38BDF8" opacity="0.15" filter="blur(55px)"/>

  <!-- Top bar -->
  <g transform="translate(30, 24)">
    <rect width="740" height="48" rx="10" fill="#111D3D" stroke="rgba(37,99,255,0.25)" stroke-width="1"/>
    <text x="24" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="14">SYSTEMS ARCHITECTURE &amp; CLOUD NODES</text>
    <rect x="590" y="10" width="134" height="28" rx="14" fill="rgba(37,99,255,0.18)" stroke="#38BDF8" stroke-width="1"/>
    <text x="606" y="28" fill="#38BDF8" font-family="sans-serif" font-weight="600" font-size="11">99.999% UPTIME</text>
  </g>

  <!-- Left Main Cloud Infrastructure Topology Card -->
  <g transform="translate(30, 88)">
    <rect width="470" height="332" rx="14" fill="url(#sysCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">DISTRIBUTED CLUSTER TOPOLOGY</text>

    <!-- Node Architecture Visual -->
    <g transform="translate(24, 60)">
      <!-- API Gateway -->
      <rect x="150" y="0" width="122" height="48" rx="10" fill="url(#nodeGlow)"/>
      <text x="211" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">API GATEWAY</text>

      <!-- Connection Lines -->
      <path d="M211 48 L100 110 M211 48 L211 110 M211 48 L320 110" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Microservices Nodes -->
      <rect x="35" y="110" width="130" height="48" rx="10" fill="#0A1125" stroke="rgba(37,99,255,0.3)" stroke-width="1"/>
      <text x="100" y="139" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Auth Service</text>

      <rect x="180" y="110" width="130" height="48" rx="10" fill="#0A1125" stroke="rgba(37,99,255,0.3)" stroke-width="1"/>
      <text x="245" y="139" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Core Engine</text>

      <rect x="325" y="110" width="65" height="48" rx="10" fill="#0A1125" stroke="rgba(37,99,255,0.3)" stroke-width="1"/>
      <text x="357" y="139" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Cache</text>

      <!-- Lines to DB -->
      <path d="M245 158 L245 200" stroke="#2563FF" stroke-width="2"/>

      <!-- Database Primary -->
      <rect x="150" y="200" width="190" height="46" rx="10" fill="#080D1D" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="245" y="228" fill="#38BDF8" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">POSTGRES CLUSTER (HA)</text>
    </g>
  </g>

  <!-- Right Side Latency & Throughput Metrics -->
  <g transform="translate(520, 88)">
    <rect width="250" height="156" rx="14" fill="url(#sysCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">API LATENCY (p99)</text>
    <text x="20" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="34" font-weight="800">12.4 <tspan font-size="16" fill="#38BDF8">ms</tspan></text>
    <rect x="20" y="96" width="210" height="32" rx="8" fill="#080D1D"/>
    <text x="32" y="117" fill="#60A5FA" font-family="sans-serif" font-size="11">Throughput: <tspan fill="#FFFFFF" font-weight="700">42.8k req/sec</tspan></text>

    <!-- Load Balancer Status -->
    <g transform="translate(0, 176)">
      <rect width="250" height="156" rx="14" fill="url(#sysCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">INFRASTRUCTURE HEALTH</text>

      <rect x="20" y="48" width="210" height="40" rx="8" fill="#080D1D"/>
      <circle cx="36" cy="68" r="5" fill="#38BDF8"/>
      <text x="50" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">eu-central-1 (Primary)</text>

      <rect x="20" y="96" width="210" height="40" rx="8" fill="#080D1D"/>
      <circle cx="36" cy="116" r="5" fill="#38BDF8"/>
      <text x="50" y="120" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">us-east-1 (Failover)</text>
    </g>
  </g>
</svg>
