services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mella-image:latest
    container_name: mella-container
    restart: unless-stopped
    ports:
      - "${PORT:-3033}:3033"
    environment:
      - NODE_ENV=production
      - PORT=3033
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3033').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
